name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-zh:
    runs-on: ubuntu-latest
    name: Build and Deploy Chinese Site → 又拍云
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Chinese site
        run: pnpm run build:zh

      - name: Deploy to 又拍云 (S3 API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YOUPAI_ACCESSKEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YOUPAI_SECRETACCESSKEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_S3_FORCE_PATH_STYLE: true
          AWS_ENDPOINT_URL: https://s3.api.upyun.com
          BUCKET: ${{ secrets.YOUPAI_BUCKET }}
        run: |
          aws configure set default.s3.signature_version s3v4
          # 使用 AWS CLI v2 的 S3 兼容 API 同步到又拍云存储
          aws s3 sync ./dist/ "s3://${BUCKET}/" --endpoint-url "${AWS_ENDPOINT_URL}" --delete --no-progress

      - name: Purge 又拍云 CDN cache
        shell: bash
        env:
          OPERATOR: ${{ secrets.YOUPAI_OPERATOR }}
          PASSWORD: ${{ secrets.YOUPAI_OPERATOR_PWD }}
          BUCKET: ${{ secrets.YOUPAI_BUCKET }}
        run: |
          if [ -z "$PASSWORD" ]; then
            echo "YOUPAI_OPERATOR_PWD not set, skipping CDN purge"
            echo "Set it in GitHub Secrets with your 又拍云 operator password"
            exit 0
          fi
          # 生成全站刷新 URL 列表。仅刷新首页/about 不够：
          # sync --delete 会删除旧的 hash 资源，若 CDN 仍缓存引用旧资源的 HTML（文章/归档页），
          # 页面会因 CSS 404 而错乱。所以每次部署后必须刷新所有页面。
          PURGE_URLS="https://blog.zinzin.cc/ https://blog.zinzin.cc/index.html"
          while IFS= read -r -d '' f; do
            rel="${f#dist/}"
            if [ "$rel" != "index.html" ]; then
              page="https://blog.zinzin.cc/${rel%/index.html}"
              PURGE_URLS="${PURGE_URLS} ${page}/ ${page}/index.html"
            fi
          done < <(find dist -type f -name index.html -print0)
          # 固定路径资源（sitemap / RSS）一并刷新
          PURGE_URLS="${PURGE_URLS} https://blog.zinzin.cc/rss.xml https://blog.zinzin.cc/sitemap-index.xml"
          PURGE_DATA=$(printf '%s\n' $PURGE_URLS)

          DATE=$(date -u "+%a, %d %b %Y %H:%M:%S GMT")
          MD5_PWD=$(echo -n "$PASSWORD" | md5sum | cut -d ' ' -f1)
          SIGN_INPUT="${PURGE_DATA}&${BUCKET}&${DATE}&${MD5_PWD}"
          SIGN=$(echo -n "$SIGN_INPUT" | md5sum | cut -d ' ' -f1)
          AUTH="UpYun ${BUCKET}:${OPERATOR}:${SIGN}"
          echo "Purging $(printf '%s' "$PURGE_DATA" | grep -c '^https') URLs"
          curl -s -X POST "http://purge.upyun.com/purge/" \
            -H "Authorization: ${AUTH}" \
            -H "Date: ${DATE}" \
            -F "purge=${PURGE_DATA}"

      - name: Install Python deps for Google submission
        run: pip install google-api-python-client oauth2client

      - name: Submit sitemap to Google Search Console
        shell: python
        env:
          CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_JSON }}
          SITE_URL: https://blog.zinzin.cc/
          SITEMAP_URL: https://blog.zinzin.cc/sitemap-index.xml
        run: |
          import json, os, sys

          credentials_json = os.environ.get("CREDENTIALS_JSON")
          if not credentials_json:
              print("GOOGLE_SEARCH_CONSOLE_JSON not set, skipping")
              sys.exit(0)

          from googleapiclient.discovery import build
          from oauth2client.service_account import ServiceAccountCredentials

          credentials = ServiceAccountCredentials.from_json_keyfile_dict(
              json.loads(credentials_json),
              ["https://www.googleapis.com/auth/webmasters"],
          )
          service = build("webmasters", "v3", credentials=credentials)
          service.sitemaps().submit(
              siteUrl=os.environ["SITE_URL"],
              feedpath=os.environ["SITEMAP_URL"],
          ).execute()
          print(f"Submitted {os.environ['SITEMAP_URL']} ✅")

      - name: Send Telegram notification (zh)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: "✅ 中文站部署成功：blog.zinzin.cc%0A🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets not set, skipping"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" > /dev/null

  deploy-en:
    runs-on: ubuntu-latest
    name: Build and Deploy English Site → Cloudflare Pages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build English site
        run: pnpm run build:en

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5deb3c4ef23e1f15ec2087e5d84a6b17
          command: pages deploy dist --project-name gzdyj-blog --branch main

      - name: Install Python deps for Google submission
        run: pip install google-api-python-client oauth2client

      - name: Submit sitemap to Google Search Console
        shell: python
        env:
          CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_JSON }}
          SITE_URL: https://blog.zinzin.top/
          SITEMAP_URL: https://blog.zinzin.top/sitemap-index.xml
        run: |
          import json, os, sys

          credentials_json = os.environ.get("CREDENTIALS_JSON")
          if not credentials_json:
              print("GOOGLE_SEARCH_CONSOLE_JSON not set, skipping")
              sys.exit(0)

          from googleapiclient.discovery import build
          from oauth2client.service_account import ServiceAccountCredentials

          credentials = ServiceAccountCredentials.from_json_keyfile_dict(
              json.loads(credentials_json),
              ["https://www.googleapis.com/auth/webmasters"],
          )
          service = build("webmasters", "v3", credentials=credentials)
          service.sitemaps().submit(
              siteUrl=os.environ["SITE_URL"],
              feedpath=os.environ["SITEMAP_URL"],
          ).execute()
          print(f"Submitted {os.environ['SITEMAP_URL']} ✅")

      - name: Send Telegram notification (en)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: "✅ 英文站部署成功：blog.zinzin.top%0A🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets not set, skipping"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" > /dev/null
